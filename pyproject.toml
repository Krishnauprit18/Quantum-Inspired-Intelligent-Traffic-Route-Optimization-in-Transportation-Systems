[tool.ruff.lint.per-file-ignores]
"src/quantroute/cli.py" = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantroute"
version = "1.0.0rc1"
description = "Secure local-first traffic route optimization platform with QPSO/QGPSO and classical baselines"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "typer>=0.9,<1",
    "pyyaml>=6.0,<7",
    "defusedxml>=0.7.1,<0.8",
]

[project.optional-dependencies]
benchmark = ["pandas>=2.0,<3", "matplotlib>=3.7,<4", "scipy>=1.10,<2"]
ortools = ["ortools>=9.7,<10"]
viz = ["matplotlib>=3.7,<4"]
service = [
    "fastapi>=0.110,<1",
    "starlette>=0.46,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.5,<3",
    "httpx>=0.27,<0.29",
]
production = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.5,<3",
    "httpx>=0.27,<0.29",
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<4",
    "scipy>=1.10,<2",
    "ortools>=9.7,<10",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "bandit[toml]>=1.7,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.8,<5",
    "httpx>=0.27,<0.29",
]

[project.scripts]
quantroute = "quantroute.cli:main"
quantroute-api = "quantroute.service.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["demo_results", ".ci-venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", "demo_results"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["quantroute"]

[tool.coverage.report]
show_missing = true
skip_covered = true
