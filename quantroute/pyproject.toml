[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantroute"
version = "0.0.1"
description = "Quantum-inspired (QPSO) traffic route optimization core — SIH26137"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
benchmark = ["pandas>=2.0", "matplotlib>=3.7", "scipy>=1.10", "pyyaml>=6.0"]
ortools = ["ortools>=9.7"]
cli = ["typer>=0.9", "pyyaml>=6.0"]
viz = ["matplotlib>=3.7"]
service = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "httpx>=0.27"]
dev = ["pytest>=7.0"]

[project.scripts]
quantroute = "quantroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
