name: secure-ci
on:
  push:
    branches: [main, master, develop]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[service,ortools,benchmark,dev]"
      - run: ruff check .
      - run: pytest --cov=quantroute --cov-report=term-missing --cov-report=xml
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
