services:
  api:
    build:
      context: .
    image: quantroute:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      QUANTROUTE_ENV: production
      QUANTROUTE_AUTH_ENABLED: "true"
      QUANTROUTE_API_KEY: ${QUANTROUTE_API_KEY:?set QUANTROUTE_API_KEY in .env}
      QUANTROUTE_ALLOWED_HOSTS: ${QUANTROUTE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      QUANTROUTE_DOCS_ENABLED: "false"
      QUANTROUTE_HOST: 0.0.0.0
      QUANTROUTE_PORT: 8000
      QUANTROUTE_FORWARDED_ALLOW_IPS: 127.0.0.1
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
